name: anumati_collect
description: "Anumati Collect: offline-first consent capture for field workers (DPDP)."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  frappe_mobile_sdk: ^2.0.0-beta.4
  provider: ^6.1.1
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  cryptography: ^2.7.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  path: ^1.8.3
  path_provider: ^2.1.2
  http: ^1.1.0
  url_launcher: ^6.2.0
  image_picker: ^1.1.2
  record: ^6.0.0
  just_audio: ^0.10.0
  connectivity_plus: ^7.1.1
  intl: ^0.20.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
