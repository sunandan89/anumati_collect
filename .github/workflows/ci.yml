name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only to publish the test APK as the "test-latest" pre-release

jobs:
  build:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Signing key (only when the GitHub Secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key in GitHub Secrets: building a debug-signed test APK only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "SIGNED=1" >> "$GITHUB_ENV"

      # One small APK per phone type instead of one big file with every type inside: modern phones
      # (arm64, almost every phone since 2017) and older 32-bit phones. Emulator-only x86_64 is left out.
      # --obfuscate shrinks and scrambles our Dart code; the symbols to read crash reports are kept
      # as a build artifact, never inside the app.
      - name: Build test APKs
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/symbols --build-number ${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk app-release.apk
          mv app-armeabi-v7a-release.apk app-release-older-phones.apk
          ls -l *.apk

      - name: Build Play bundle (signed builds only)
        if: env.SIGNED == '1'
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols \
            --build-number ${{ github.run_number }}

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: anumati-collect-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release-older-phones.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: anumati-collect-symbols-${{ github.run_number }}
          path: build/symbols
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: env.SIGNED == '1'
        with:
          name: anumati-collect-play-bundle-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # A direct download link for phones (no zip): Releases → "Test build (latest)".
      - name: Publish test APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: Test build (latest)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Test APK from ${{ github.ref_name }} at ${{ github.sha }} (build ${{ github.run_number }}).
            Debug-signed: for testing only, not for the Play Store.
            app-release.apk: almost every phone (64-bit, 2017 and later).
            app-release-older-phones.apk: only if the first one says it isn't compatible.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release-older-phones.apk
